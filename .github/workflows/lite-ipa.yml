name: lite-ipa

# Builds Pinky's iPhone app (lite scheme) only — no desktop, no tests.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle id for the lite app"
        required: false
        default: "com.example.pinky.lite"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: xcodegen
        run: command -v xcodegen >/dev/null || brew install --quiet xcodegen

      - name: Unpack WebDriverAgent test bundle
        run: |
          mkdir -p ci-assets/wda
          tar -xzf ci-assets/wda.xctest.tar.gz -C ci-assets/wda
          test -d ci-assets/wda/WebDriverAgentRunner.xctest

      - name: Build lite (unsigned, with WDA)
        env:
          PINKY_SIGN: "0"
          PINKY_BUNDLE_ID: ${{ inputs.bundle_id }}
          PINKY_WDA: ${{ github.workspace }}/ci-assets/wda/WebDriverAgentRunner.xctest
        run: ./ios/build.sh lite

      - name: Pack unsigned ipa
        run: |
          APP="ios/app/build/dd/Build/Products/Debug-iphoneos/PinkyLite.app"
          test -d "$APP"
          ls -d "$APP"/PlugIns/* || true
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry pinky-lite-unsigned.ipa Payload
          unzip -l pinky-lite-unsigned.ipa | tail -12

      - uses: actions/upload-artifact@v4
        with:
          name: pinky-lite-unsigned
          path: out/pinky-lite-unsigned.ipa
          if-no-files-found: error
